packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ does not run dependency build scripts unless they are listed here.
# These all install native binaries this project needs at runtime:
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
